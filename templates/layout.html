<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>ЕЦМ — Единый Центр Мониторинга питания</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  {% block styles %}{% endblock %}


  <style>
    :root {
      --ink-950: #0f1729;
      --ink-900: #1a2740;
      --mist-50: #f5f8fc;
      --mist-100: #eaf1f8;
      --mist-200: #d7e5f2;
      --navy-900: #0f1729;
      --navy-800: #1a2740;
      --navy-700: #243552;
      --slate-50: #f5f8fc;
      --slate-100: #eaf1f8;
      --slate-200: #d7e5f2;
      --slate-300: #b8cde3;
      --slate-400: #7f9bb8;
      --slate-500: #5c7896;
      --slate-600: #445e7a;
      --slate-700: #334866;
      --slate-800: #243552;
      --slate-900: #1a2740;

      --primary: #5b9fd4;
      --primary-dark: #3d7eb8;
      --primary-light: #8bbfe6;
      --primary-bg: rgba(91, 159, 212, 0.12);
      --primary-glow: rgba(91, 159, 212, 0.16);
      --accent: #6b9fd6;
      --accent-dark: #4a86c0;
      --success: #3d9a78;
      --danger: #d46565;
      --warning: #d4a35b;

      --bg-main: #eef4fa;
      --bg-card: #ffffff;
      --bg-card-solid: #ffffff;
      --bg-muted: #f5f8fc;
      --border: #c9d9ea;
      --border-light: rgba(26, 39, 64, 0.1);
      --text-primary: #1a2740;
      --text-secondary: #445e7a;
      --text-muted: #5c7896;

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.25rem;
      --space-6: 1.5rem;
      --space-8: 2rem;

      --shadow-sm: 0 1px 2px rgba(26, 39, 64, 0.05);
      --shadow-md: 0 4px 14px rgba(26, 39, 64, 0.07);
      --shadow-lg: 0 12px 28px rgba(26, 39, 64, 0.09);
      --shadow-xl: 0 20px 40px rgba(26, 39, 64, 0.11);
      --shadow-focus: 0 0 0 3px rgba(91, 159, 212, 0.25);

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --radius-xl: 18px;

      --transition: all 0.18s ease;
      --glass-blur: blur(0px);
      --font-sans: "Manrope", "Segoe UI", sans-serif;
    }

    [data-theme='dark'] {
      --bg-main: #0f1729;
      --bg-card: #162033;
      --bg-card-solid: #162033;
      --bg-muted: #1a2740;
      --border: #2a3d5c;
      --border-light: rgba(234, 241, 248, 0.1);
      --text-primary: #eaf1f8;
      --text-secondary: #b8cde3;
      --text-muted: #7f9bb8;
      --primary: #7eb8e8;
      --primary-dark: #5b9fd4;
      --primary-light: #a8d4f5;
      --primary-bg: rgba(126, 184, 232, 0.14);
      --primary-glow: rgba(126, 184, 232, 0.18);
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-md: 0 4px 14px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 28px rgba(0, 0, 0, 0.45);
      --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.5);
      --shadow-focus: 0 0 0 3px rgba(126, 184, 232, 0.28);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--font-sans);
      background: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.55;
      font-weight: 500;
      font-size: 0.9375rem;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      position: relative;
    }

    /* Soft sky wash + fine grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 100% -10%, rgba(91, 159, 212, 0.14), transparent 55%),
        radial-gradient(ellipse 60% 40% at -10% 100%, rgba(139, 191, 230, 0.1), transparent 50%),
        linear-gradient(180deg, #eef4fa 0%, #f5f9fc 45%, #e8f1f8 100%);
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: 0.28;
      background-image:
        linear-gradient(rgba(26, 39, 64, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(26, 39, 64, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
    }

    [data-theme='dark'] body::before {
      background:
        radial-gradient(ellipse 70% 45% at 90% 0%, rgba(126, 184, 232, 0.1), transparent 50%),
        linear-gradient(180deg, #0f1729 0%, #121a2b 100%);
    }

    [data-theme='dark'] body::after {
      opacity: 0.18;
      background-image:
        linear-gradient(rgba(234, 241, 248, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(234, 241, 248, 0.04) 1px, transparent 1px);
    }

    .theme-toggle {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 44px;
      height: 44px;
      background: var(--bg-card-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
      box-shadow: var(--shadow-sm);
      z-index: 1000;
    }

    .theme-toggle:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
      background: var(--primary-bg);
    }

    .theme-toggle svg {
      width: 18px;
      height: 18px;
      stroke: var(--text-secondary);
    }

    .theme-toggle:hover svg { stroke: var(--primary); }

    .navbar {
      background: rgba(255, 255, 255, 0.88);
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: saturate(1.2) blur(10px);
      -webkit-backdrop-filter: saturate(1.2) blur(10px);
    }

    [data-theme='dark'] .navbar {
      background: rgba(22, 36, 31, 0.9);
      border-bottom-color: var(--border-light);
    }

    .navbar-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0.7rem 1.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 42px;
      height: 42px;
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      flex-shrink: 0;
      overflow: hidden;
      background: var(--mist-100);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .logo:hover .logo-icon {
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
      border-color: var(--primary);
    }

    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .logo-text h1 {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.04em;
      line-height: 1.15;
    }

    .logo:hover .logo-text h1 { color: var(--primary); }

    .logo-text p {
      font-size: 0.62rem;
      color: var(--text-muted);
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 0.8rem;
      border-radius: var(--radius-md);
      font-weight: 600;
      font-size: 0.78rem;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      text-decoration: none;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      position: relative;
      font-family: inherit;
    }

    .nav-btn::after { display: none; }

    .nav-btn:hover {
      background: var(--primary-bg);
      color: var(--primary-dark);
      border-color: rgba(91, 159, 212, 0.18);
    }

    [data-theme='dark'] .nav-btn:hover { color: var(--primary-light); }

    .nav-btn-primary {
      background: var(--primary);
      color: #fff !important;
      border-color: transparent;
      box-shadow: var(--shadow-sm);
    }

    .nav-btn-primary:hover {
      background: var(--primary-dark);
      color: #fff !important;
      border-color: transparent;
    }

    .nav-btn-outline {
      border-color: var(--border);
      background: var(--bg-card-solid);
    }

    .nav-btn-outline:hover {
      border-color: var(--primary);
      background: var(--primary-bg);
      color: var(--primary-dark);
    }

    .dropdown { position: relative; }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 240px;
      background: var(--bg-card-solid);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-6px);
      transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
      z-index: 1000;
    }

    .dropdown-menu.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .dropdown-header {
      padding: 0.7rem 1rem;
      background: var(--bg-muted);
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-light);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 1rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background 0.15s ease, color 0.15s ease;
      border-bottom: 1px solid var(--border-light);
    }

    .dropdown-item:last-child { border-bottom: none; }

    .dropdown-item:hover {
      background: var(--primary-bg);
      color: var(--primary-dark);
    }

    .dropdown-item svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    .dropdown-divider {
      height: 1px;
      background: var(--border-light);
      margin: 0;
    }

    .page-container {
      min-height: calc(100vh - 68px);
      background: transparent;
      position: relative;
      z-index: 1;
    }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: var(--mist-300);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover { background: var(--primary); }

    @media (max-width: 900px) {
      .navbar-container {
        padding: 0.7rem 1rem;
        flex-direction: column;
        align-items: stretch;
      }
      .nav-links {
        justify-content: flex-start;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 2px;
      }
      .theme-toggle { bottom: 16px; right: 16px; }
    }

    @media (max-width: 550px) {
      .nav-btn {
        padding: 0.35rem 0.6rem;
        font-size: 0.72rem;
        white-space: nowrap;
      }
      .logo-text p { display: none; }
      .logo-text h1 { font-size: 0.95rem; }
      .logo-icon { width: 36px; height: 36px; }
    }

    .fade-in-up {
      animation: fadeUp 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade-in-up { animation: none !important; }
    }
  </style>

</head>
<body>
  <button class="theme-toggle" id="theme-toggle" title="Сменить тему">
    <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
  </button>

  <nav class="navbar">
    <div class="navbar-container">
      <a href="/" class="logo">
        <!-- Пользовательский логотип (ICO) -->
        <div class="logo-icon">
          <img 
            src="static/app.ico"
            alt="Кот"
            width="44"
            height="44"
          >
        </div>
        <div class="logo-text">
          <h1>ЕЦМП</h1>
          <p>Единый Центр Мониторинга питания</p>
        </div>
      </a>

      <div class="nav-links">
        <!-- Мониторинг питания (выпадающее) -->
        <div class="dropdown">
          <button class="nav-btn nav-btn-primary" id="monitoring-toggle">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              <path d="M9 17l5-5-5-5"/>
            </svg>
            Мониторинг
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div class="dropdown-menu" id="monitoring-menu">
            <div class="dropdown-header">Мониторинг питания</div>
            <a href="/analis" class="dropdown-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
              Анализ статистики
            </a>
            <a href="/util" class="dropdown-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
              </svg>
              Утилиты ЕЦМП
            </a>
            <div class="dropdown-divider"></div>
            <a href="/register" class="dropdown-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="8.5" cy="7" r="4"/>
                <line x1="20" y1="8" x2="20" y2="14"/>
                <line x1="23" y1="11" x2="17" y2="11"/>
              </svg>
              Регистрация
            </a>
            <a href="/login" class="dropdown-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.5 12H3"/>
              </svg>
              Вход / Выход
            </a>
          </div>
        </div>

        <!-- Дашборды -->
        <a href="/dashboards" class="nav-btn nav-btn-outline">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
            <line x1="15" y1="3" x2="15" y2="21"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
          </svg>
          Дашборды
        </a>

        <!-- Справочный центр -->
        <a href="/knowledge-base" class="nav-btn nav-btn-outline">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          Справочный центр
        </a>

        <!-- Поддержка -->
        <a href="/support" class="nav-btn nav-btn-outline">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          Поддержка
        </a>

        <!-- Инструкции -->
        <a href="/tutorials" class="nav-btn nav-btn-outline">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Инструкции
        </a>
      </div>
    </div>
  </nav>

  <div class="page-container">
    {% block content %}{% endblock %}
  </div>

  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const html = document.documentElement;

    const sunIcon = `<circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;

    const moonIcon = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;

    function setTheme(theme) {
      html.setAttribute('data-theme', theme);
      localStorage.setItem('ecm_theme', theme);
      themeIcon.innerHTML = theme === 'dark' ? moonIcon : sunIcon;
    }

    const savedTheme = localStorage.getItem('ecm_theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(savedTheme || (prefersDark ? 'dark' : 'light'));

    themeToggle.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    function initDropdown(btnId, menuId) {
      const btn = document.getElementById(btnId);
      const menu = document.getElementById(menuId);
      if (!btn || !menu) return;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.dropdown-menu').forEach(m => {
          if (m !== menu) m.classList.remove('show');
        });
        menu.classList.toggle('show');
      });
    }

    initDropdown('monitoring-toggle', 'monitoring-menu');

    document.addEventListener('click', () => {
      document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
    });
  </script>
  
  {% block extra_js %}{% endblock %}
</body>
</html>
