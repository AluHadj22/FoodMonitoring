<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>ЕЦМ — Единый Центр Мониторинга питания</title>
  {% block styles %}{% endblock %}

  <style>
    /* ------------------------------
       Глобальные переменные
    -------------------------------- */
    :root {
      --navy-900: #0a1e3c;
      --navy-800: #13294b;
      --navy-700: #1e3a6b;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      
      --primary: #1a4c8c;
      --primary-dark: #0e3a6b;
      --primary-light: #2c6eb0;
      --primary-bg: rgba(26, 76, 140, 0.08);
      --primary-glow: rgba(26, 76, 140, 0.15);
      --accent: #d97706;
      --accent-dark: #b45309;
      --success: #059669;
      --danger: #dc2626;
      --warning: #d97706;
      
      --bg-main: #f8fafc;
      --bg-card: rgba(255, 255, 255, 0.75);
      --bg-card-solid: #ffffff;
      --border-light: rgba(233, 238, 243, 0.5);
      --text-primary: #0f172a;
      --text-secondary: #475569;
      --text-muted: #64748b;
      
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.03);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06), 0 2px 4px rgba(0, 0, 0, 0.03);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.08), 0 4px 8px rgba(0, 0, 0, 0.04);
      --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.10), 0 8px 16px rgba(0, 0, 0, 0.04);
      --shadow-focus: 0 0 0 3px rgba(26, 76, 140, 0.15);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --glass-blur: blur(16px);
    }

    [data-theme='dark'] {
      --bg-main: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-card-solid: #1e293b;
      --border-light: rgba(51, 65, 85, 0.5);
      --text-primary: #f1f5f9;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-dark: #2563eb;
      --primary-light: #60a5fa;
      --primary-bg: rgba(59, 130, 246, 0.08);
      --primary-glow: rgba(59, 130, 246, 0.12);
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 32px rgba(0, 0, 0, 0.5);
      --shadow-xl: 0 24px 48px rgba(0, 0, 0, 0.6);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg-main);
      color: var(--text-primary);
      line-height: 1.5;
      transition: background 0.4s ease, color 0.3s ease;
      font-weight: 400;
      font-size: 0.9375rem;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    /* Фоновый градиент для красоты */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(ellipse at 20% 50%, rgba(26, 76, 140, 0.04) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(26, 76, 140, 0.03) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 80%, rgba(26, 76, 140, 0.02) 0%, transparent 40%);
      pointer-events: none;
      z-index: 0;
    }

    [data-theme='dark'] body::before {
      background: radial-gradient(ellipse at 20% 50%, rgba(59, 130, 246, 0.06) 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 20%, rgba(59, 130, 246, 0.04) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 80%, rgba(59, 130, 246, 0.03) 0%, transparent 40%);
    }

    /* Тема-тугл (минималистичный) */
    .theme-toggle {
      position: fixed;
      bottom: 28px;
      right: 28px;
      width: 44px;
      height: 44px;
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-light);
      border-radius: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: var(--shadow-md);
      z-index: 1000;
    }

    .theme-toggle:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: var(--shadow-lg);
      border-color: var(--primary-light);
    }

    .theme-toggle svg {
      width: 20px;
      height: 20px;
      stroke: var(--text-secondary);
      transition: stroke 0.2s;
    }

    /* Навбар (профессиональный) */
    .navbar {
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--border-light);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .navbar-container {
      max-width: 1440px;
      margin: 0 auto;
      padding: 0.875rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
      flex-wrap: wrap;
      position: relative;
      z-index: 1;
    }

    /* Логотип со стилями из NeTvoyoDelo */
    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      text-decoration: none;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
      box-shadow: 0 2px 8px var(--primary-glow);
    }

    .logo-icon::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.2), transparent 60%);
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .logo:hover .logo-icon::after {
      opacity: 1;
    }

    .logo-icon svg {
      width: 22px;
      height: 22px;
      stroke: white;
      stroke-width: 1.8;
      position: relative;
      z-index: 1;
      transition: transform 0.3s ease;
    }

    .logo:hover .logo-icon svg {
      transform: scale(1.1) rotate(-3deg);
    }

    .logo-icon::before {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: var(--radius-md);
      background: var(--primary);
      opacity: 0;
      z-index: -1;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .logo:hover .logo-icon::before {
      opacity: 0.3;
      transform: scale(1.05);
      animation: pulse-logo 1.5s ease-in-out infinite;
    }

    @keyframes pulse-logo {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.08); opacity: 0.5; }
    }

    .logo-text h1 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: -0.2px;
      line-height: 1.3;
      transition: color 0.2s ease;
    }

    .logo:hover .logo-text h1 {
      color: var(--primary);
    }

    .logo-text p {
      font-size: 0.7rem;
      color: var(--text-muted);
      font-weight: 450;
      letter-spacing: 0.2px;
    }

    /* Навигация */
    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .nav-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1rem;
      border-radius: var(--radius-md);
      font-weight: 500;
      font-size: 0.85rem;
      cursor: pointer;
      transition: var(--transition);
      text-decoration: none;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      position: relative;
    }

    .nav-btn::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 0;
      height: 2px;
      background: var(--primary);
      transition: all 0.3s ease;
      transform: translateX(-50%);
    }

    .nav-btn:hover::after {
      width: 60%;
    }

    .nav-btn:hover {
      background: var(--primary-bg);
      color: var(--primary);
    }

    .nav-btn-primary {
      background: var(--primary);
      color: white;
      box-shadow: var(--shadow-sm);
    }

    .nav-btn-primary::after {
      display: none;
    }

    .nav-btn-primary:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
      color: white;
    }

    .nav-btn-outline {
      border: 1px solid var(--border-light);
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
    }

    .nav-btn-outline:hover {
      border-color: var(--primary);
      background: var(--primary-bg);
      color: var(--primary);
    }

    /* Dropdown — стиль enterprise */
    .dropdown {
      position: relative;
    }

    .dropdown-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      min-width: 260px;
      background: var(--bg-card);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-lg);
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(0.98);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
    }

    .dropdown-menu.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .dropdown-header {
      padding: 0.75rem 1rem;
      background: var(--primary-bg);
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--primary);
      border-bottom: 1px solid var(--border-light);
    }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.7rem 1rem;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 480;
      transition: var(--transition);
      border-bottom: 1px solid var(--border-light);
    }

    .dropdown-item:last-child {
      border-bottom: none;
    }

    .dropdown-item:hover {
      background: var(--primary-bg);
      color: var(--primary);
    }

    .dropdown-item svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
    }

    .dropdown-divider {
      height: 1px;
      background: var(--border-light);
      margin: 6px 0;
    }

    .page-container {
      min-height: calc(100vh - 68px);
      background: var(--bg-main);
      position: relative;
      z-index: 1;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in {
      animation: fadeSlide 0.5s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
    }

    /* Скролл (элегантный) */
    ::-webkit-scrollbar {
      width: 5px;
      height: 5px;
    }

    ::-webkit-scrollbar-track {
      background: var(--border-light);
      border-radius: 8px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 8px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary-dark);
    }

    @media (max-width: 1024px) {
      .navbar-container {
        padding: 0.875rem 1.5rem;
      }
    }

    @media (max-width: 900px) {
      .navbar-container {
        padding: 0.875rem 1.25rem;
        flex-direction: column;
        align-items: stretch;
      }
      .nav-links {
        justify-content: flex-start;
        overflow-x: auto;
        flex-wrap: nowrap;
        padding-bottom: 4px;
      }
      .theme-toggle {
        bottom: 20px;
        right: 20px;
      }
    }

    @media (max-width: 550px) {
      .nav-btn {
        padding: 0.4rem 0.75rem;
        font-size: 0.78rem;
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" title="Сменить тему">
    <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
    </svg>
  </button>

  <nav class="navbar">
    <div class="navbar-container">
      <a href="/" class="logo">
        <div class="logo-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 3C7 3 3 7 3 12s4 9 9 9 9-4 9-9-4-9-9-9z"/>
            <path d="M12 8v8M8 12h8"/>
            <circle cx="12" cy="12" r="2"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>ЕЦМ</h1>
          <p>Единый Центр Мониторинга питания</p>
        </div>
      </a>

      <div class="nav-links">
        <!-- Мониторинг питания (выпадающее) -->
        <div class="dropdown">
          <button class="nav-btn nav-btn-primary" id="monitoring-toggle">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
              <path d="M9 17l5-5-5-5"/>
            </svg>
            Мониторинг
            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"/>
            </svg>
          </button>
          <div class="dropdown-menu" id="monitoring-menu">
            <div class="dropdown-header">Мониторинг питания</div>
            <a href="/analis" class="dropdown-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
              </svg>
              Анализ статистики
            </a>
            <a href="/util" class="dropdown-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
              </svg>
              Утилиты ЕЦМП
            </a>
            <div class="dropdown-divider"></div>
            <a href="/register" class="dropdown-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="8.5" cy="7" r="4"/>
                <line x1="20" y1="8" x2="20" y2="14"/>
                <line x1="23" y1="11" x2="17" y2="11"/>
              </svg>
              Регистрация
            </a>
            <a href="/login" class="dropdown-item">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.5 12H3"/>
              </svg>
              Вход / Выход
            </a>
          </div>
        </div>

        <!-- Дашборды -->
        <a href="/dashboards" class="nav-btn nav-btn-outline">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="9" y1="3" x2="9" y2="21"/>
            <line x1="15" y1="3" x2="15" y2="21"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="3" y1="15" x2="21" y2="15"/>
          </svg>
          Дашборды
        </a>

        <!-- Справочный центр -->
        <a href="/knowledge-base" class="nav-btn nav-btn-outline">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          Справочный центр
        </a>

        <!-- Поддержка -->
        <a href="/support" class="nav-btn nav-btn-outline">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
          Поддержка
        </a>

        <!-- Инструкции -->
        <a href="/tutorials" class="nav-btn nav-btn-outline">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Инструкции
        </a>
      </div>
    </div>
  </nav>

  <div class="page-container">
    {% block content %}{% endblock %}
  </div>

  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const html = document.documentElement;

    const sunIcon = `<circle cx="12" cy="12" r="5"></circle>
      <line x1="12" y1="1" x2="12" y2="3"></line>
      <line x1="12" y1="21" x2="12" y2="23"></line>
      <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
      <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
      <line x1="1" y1="12" x2="3" y2="12"></line>
      <line x1="21" y1="12" x2="23" y2="12"></line>
      <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
      <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;

    const moonIcon = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>`;

    function setTheme(theme) {
      html.setAttribute('data-theme', theme);
      localStorage.setItem('ecm_theme', theme);
      themeIcon.innerHTML = theme === 'dark' ? moonIcon : sunIcon;
    }

    const savedTheme = localStorage.getItem('ecm_theme');
    const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    setTheme(savedTheme || (prefersDark ? 'dark' : 'light'));

    themeToggle.addEventListener('click', () => {
      const current = html.getAttribute('data-theme');
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    function initDropdown(btnId, menuId) {
      const btn = document.getElementById(btnId);
      const menu = document.getElementById(menuId);
      if (!btn || !menu) return;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        document.querySelectorAll('.dropdown-menu').forEach(m => {
          if (m !== menu) m.classList.remove('show');
        });
        menu.classList.toggle('show');
      });
    }

    initDropdown('monitoring-toggle', 'monitoring-menu');

    document.addEventListener('click', () => {
      document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
    });
  </script>
  
  {% block extra_js %}{% endblock %}
</body>
</html>
