<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ЕЦМП ЧР</title>
   <!-- Блок для вставки стилей из дочерних шаблонов -->
  {% block styles %}{% endblock %}

   <style>
    :root {
      --indigo: #6366f1;
      --indigo-dark: #4338ca;
      --indigo-light: #c7d2fe;
      --orange: #f59e0b;
      --orange-dark: #d97706;
      --green: #10b981;
      --green-dark: #059669;
      --slate-50: #f8fafc;
      --slate-100: #f1f5f9;
      --slate-200: #e2e8f0;
      --slate-300: #cbd5e1;
      --slate-400: #94a3b8;
      --slate-500: #64748b;
      --slate-600: #475569;
      --slate-700: #334155;
      --slate-800: #1e293b;
      --slate-900: #0f172a;
      --dark-bg: #0f172a;
      --dark-surface: #1e293b;
      --dark-card: #334155;
      --dark-border: #475569;
      --radius-lg: 1.5rem;
      --radius-md: 1rem;
      --radius-sm: 0.75rem;
      --transition-base: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.3);
      --shadow-md: 0 4px 6px rgba(0,0,0,0.3);
      --shadow-lg: 0 10px 15px rgba(0,0,0,0.4);
      --shadow-xl: 0 20px 25px rgba(0,0,0,0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, var(--dark-bg) 0%, #1a202c 100%);
      background-attachment: fixed;
      color: var(--slate-100);
      line-height: 1.6;
    }

    /* Навигация */
    nav {
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(20px);
      box-shadow: var(--shadow-lg);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--dark-border);
    }

    .navbar-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      max-width: 1400px;
      margin: 0 auto;
      gap: 2rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-shrink: 0;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--indigo) 0%, var(--orange) 100%);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 1rem;
      flex-shrink: 0;
      box-shadow: var(--shadow-md);
    }

    .logo-text {
      display: flex;
      flex-direction: column;
      gap: 0.2rem;
    }

    .navbar-container h1 {
      font-weight: 800;
      font-size: 1.3rem;
      background: linear-gradient(135deg, var(--slate-100) 0%, var(--indigo-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin: 0;
      letter-spacing: -0.3px;
      line-height: 1.2;
    }

    .logo-subtitle {
      font-size: 0.8rem;
      color: var(--slate-400);
      font-weight: 600;
      letter-spacing: 0.3px;
      line-height: 1.3;
    }

    .logo-author {
      font-size: 0.75rem;
      color: var(--slate-500);
      font-weight: 500;
      font-style: italic;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex-grow: 1;
    }

    .nav-link, .nav-button {
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius-md);
      transition: var(--transition-base);
      white-space: nowrap;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: var(--shadow-sm);
    }

    .nav-link {
      color: var(--slate-300);
      background: var(--dark-card);
      border: 2px solid var(--dark-border);
    }

    .nav-link:hover {
      background: var(--dark-surface);
      color: var(--indigo-light);
      border-color: var(--indigo);
      transform: translateY(-2px);
      box-shadow: var(--shadow-xl);
    }

    .nav-button {
      background: linear-gradient(135deg, var(--indigo) 0%, var(--indigo-dark) 100%);
      color: white;
      border: none;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
    }

    .nav-button:hover {
      background: linear-gradient(135deg, var(--indigo-dark) 0%, #3730a3 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(99, 102, 241, 0.6);
    }

    /* Кнопка анализа статистики */
    .stats-button {
      background: linear-gradient(135deg, var(--green) 0%, var(--green-dark) 100%);
      color: white;
      border: none;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }

    .stats-button:hover {
      background: linear-gradient(135deg, var(--green-dark) 0%, #047857 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6);
    }

    /* Специальная кнопка для утилит */
    .utils-button {
      background: linear-gradient(135deg, var(--orange) 0%, var(--orange-dark) 100%);
      color: white;
      border: none;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
    }

    .utils-button:hover {
      background: linear-gradient(135deg, var(--orange-dark) 0%, #b45309 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(245, 158, 11, 0.6);
    }

    .utils-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.6s;
    }

    .utils-button:hover::before {
      left: 100%;
    }

    /* Контейнер страницы */
    .page-container {
      padding: 2rem;
      min-height: calc(100vh - 80px);
      max-width: 1400px;
      margin: 0 auto;
    }

    /* Анимации */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-in-up {
      animation: fadeInUp 0.6s ease-out;
    }

    /* Эффект стекла для навигации */
    nav::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(20px);
      z-index: -1;
    }

    /* Адаптивность */
    @media (max-width: 1024px) {
      .navbar-container {
        padding: 1rem 1.5rem;
        gap: 1.5rem;
      }
      
      .nav-links {
        gap: 0.6rem;
      }
      
      .nav-link, .nav-button {
        padding: 0.6rem 1rem;
        font-size: 0.8rem;
      }

      .navbar-container h1 {
        font-size: 1.1rem;
      }

      .logo-subtitle {
        font-size: 0.75rem;
      }

      .logo-author {
        font-size: 0.7rem;
      }
    }

    @media (max-width: 768px) {
      .navbar-container {
        padding: 0.9rem 1rem;
        flex-direction: column;
        gap: 1rem;
      }

      .logo {
        gap: 0.6rem;
      }

      .logo-icon {
        width: 36px;
        height: 36px;
        font-size: 0.9rem;
      }

      .navbar-container h1 {
        font-size: 1rem;
        text-align: center;
      }

      .nav-links {
        justify-content: center;
        width: 100%;
        gap: 0.5rem;
      }

      .nav-link, .nav-button {
        padding: 0.6rem 1rem;
        font-size: 0.8rem;
        flex: 1;
        justify-content: center;
        min-width: 140px;
      }

      .page-container {
        padding: 1.5rem 1rem;
        min-height: calc(100vh - 70px);
      }
    }

    @media (max-width: 480px) {
      .nav-links {
        flex-direction: column;
        width: 100%;
      }

      .nav-link, .nav-button {
        width: 100%;
        text-align: center;
      }

      .logo-text {
        text-align: center;
      }

      .navbar-container h1 {
        font-size: 0.95rem;
      }

      .logo-subtitle, .logo-author {
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>
  <nav>
    <div class="navbar-container fade-in">
      <div class="logo">
        <div class="logo-icon">ЕЦ</div>
        <div class="logo-text">
          <h1>ЕДИНЫЙ ЦЕНТР МОНИТОРИНГА ПИТАНИЯ</h1>
          <div class="logo-subtitle">Версия для Чеченской Республики</div>
          <div class="logo-author">автор: Хаджиев Алу Ибрагимович</div>
        </div>
      </div>
      
      <div class="nav-links">
        <a href="/login" class="nav-link">
          <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.5 12H3"/>
          </svg>
          Вход / Выход
        </a>
        
        <a href="/register" class="nav-button">
          <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="8.5" cy="7" r="4"/>
            <line x1="20" y1="8" x2="20" y2="14"/>
            <line x1="23" y1="11" x2="17" y2="11"/>
          </svg>
          Регистрация
        </a>
        
        <a href="/analis" class="nav-button stats-button">
          <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            <path d="M9 17l5-5-5-5"/>
          </svg>
          Анализ статистики
        </a>
        
        <a href="https://disk.yandex.ru/d/a7DfnkuAtep2yw" target="_blank" class="nav-button utils-button">
          <svg style="width:14px;height:14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="17 8 12 3 7 8"/>
            <line x1="12" y1="3" x2="12" y2="15"/>
          </svg>
          Утилиты ЕЦМП
        </a>
      </div>
    </div>
  </nav>

  <div class="page-container">
    {% block content %}{% endblock %}
  </div>

  <script>
    // Анимация появления элементов
    document.addEventListener('DOMContentLoaded', function() {
      const elements = document.querySelectorAll('.fade-in');
      
      elements.forEach((el, index) => {
        setTimeout(() => {
          el.style.opacity = '1';
          el.style.transform = 'translateY(0)';
        }, index * 100);
      });
    });

    // Эффект параллакса для фона
    window.addEventListener('scroll', function() {
      const scrolled = window.pageYOffset;
      const background = document.querySelector('body');
      background.style.backgroundPosition = `center ${scrolled * 0.5}px`;
    });

    // Интерактивность для кнопок
    const buttons = document.querySelectorAll('.nav-link, .nav-button');
    buttons.forEach(button => {
      button.addEventListener('mousedown', function() {
        this.style.transform = 'translateY(0)';
      });
      
      button.addEventListener('mouseup', function() {
        this.style.transform = 'translateY(-1px)';
      });
    });
  </script>
</body>
</html>
