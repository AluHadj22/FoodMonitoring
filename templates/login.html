{% extends "layout.html" %}
{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');

    .auth-container {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: calc(100vh - 73px);
        padding: 2rem;
        position: relative;
        overflow: hidden;
        background: var(--bg-main);
    }

    /* Фоновые круглые фигуры - статичные для производительности */
    .auth-container .bg-circles {
        position: absolute;
        pointer-events: none;
        user-select: none;
        z-index: 0;
        width: 100%;
        height: 100%;
        top: 0;
        left: 0;
        overflow: hidden;
    }

    .auth-container .bg-circle {
        position: absolute;
        border-radius: 50%;
        opacity: 0.06;
        background: var(--primary);
    }

    .auth-container .bg-circle-1 {
        width: 400px;
        height: 400px;
        top: -150px;
        right: -120px;
        opacity: 0.05;
    }

    .auth-container .bg-circle-2 {
        width: 280px;
        height: 280px;
        bottom: -80px;
        left: -80px;
        opacity: 0.04;
    }

    .auth-container .bg-circle-3 {
        width: 160px;
        height: 160px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        opacity: 0.03;
    }

    .auth-container .bg-circle-4 {
        width: 100px;
        height: 100px;
        top: 20%;
        right: 10%;
        opacity: 0.05;
    }

    .auth-container .bg-circle-5 {
        width: 140px;
        height: 140px;
        bottom: 25%;
        left: 5%;
        opacity: 0.04;
    }

    /* Широкая прямоугольная карточка */
    .auth-card {
        background: linear-gradient(145deg, rgba(255,255,255,0.95) 0%, rgba(240, 248, 255, 0.95) 100%);
        border-radius: 28px;
        padding: 3.5rem 4rem;
        width: 100%;
        max-width: 640px;
        border: 1px solid rgba(59, 130, 246, 0.1);
        box-shadow: 0 20px 60px rgba(59, 130, 246, 0.08);
        transition: box-shadow 0.2s ease, transform 0.2s ease;
        position: relative;
        z-index: 1;
        overflow: hidden;
    }

    [data-theme='dark'] .auth-card {
        background: linear-gradient(145deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
        border-color: rgba(59, 130, 246, 0.12);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .auth-card:hover {
        box-shadow: 0 25px 70px rgba(59, 130, 246, 0.12);
        transform: translateY(-2px);
    }

    /* Контейнер для картинки кота */
    .cat-image-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: -0.5rem auto 1.5rem;
        position: relative;
        z-index: 2;
    }

    .cat-image-wrapper img {
        width: 120px;
        height: 120px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid rgba(59, 130, 246, 0.15);
        box-shadow: 0 8px 32px rgba(59, 130, 246, 0.12);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        display: block;
        background: #f8fafc;
    }

    [data-theme='dark'] .cat-image-wrapper img {
        border-color: rgba(59, 130, 246, 0.2);
        box-shadow: 0 8px 32px rgba(59, 130, 246, 0.08);
        background: #1e293b;
    }

    .cat-image-wrapper img:hover {
        transform: scale(1.04) rotate(-2deg);
        box-shadow: 0 12px 40px rgba(59, 130, 246, 0.18);
    }

    /* Круговой фон за котом */
    .cat-image-wrapper::before {
        content: '';
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.06) 0%, transparent 70%);
        z-index: -1;
        animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
        0%, 100% { transform: scale(1); opacity: 0.6; }
        50% { transform: scale(1.08); opacity: 1; }
    }

    [data-theme='dark'] .cat-image-wrapper::before {
        background: radial-gradient(circle, rgba(59, 130, 246, 0.04) 0%, transparent 70%);
    }

    /* Заголовки */
    .auth-title {
        text-align: center;
        font-size: 1.75rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 0.5rem;
        letter-spacing: -0.5px;
        position: relative;
        z-index: 2;
    }

    .auth-title span {
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .auth-subtitle {
        text-align: center;
        font-size: 0.9rem;
        color: var(--text-secondary);
        margin-bottom: 2rem;
        position: relative;
        z-index: 2;
        font-weight: 400;
        line-height: 1.6;
        opacity: 0.8;
    }

    /* Форма */
    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
        position: relative;
        z-index: 2;
    }

    .form-group {
        position: relative;
    }

    .form-group input {
        width: 100%;
        padding: 1rem 1.25rem;
        background: rgba(255, 255, 255, 0.7);
        border: 2px solid rgba(59, 130, 246, 0.1);
        border-radius: 16px;
        font-size: 0.95rem;
        color: var(--text-primary);
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
        font-family: inherit;
    }

    [data-theme='dark'] .form-group input {
        background: rgba(30, 41, 59, 0.6);
        border-color: rgba(59, 130, 246, 0.08);
        color: #e2e8f0;
    }

    .form-group input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        background: rgba(255, 255, 255, 0.85);
    }

    .form-group input::placeholder {
        color: var(--text-secondary);
        font-weight: 400;
        font-size: 0.9rem;
        opacity: 0.7;
    }

    /* Чекбокс и кнопка "Показать пароль" */
    .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0.25rem 0 0.5rem;
        font-size: 0.9rem;
        position: relative;
        z-index: 2;
    }

    .remember-me {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--text-secondary);
        cursor: pointer;
        font-weight: 400;
        transition: color 0.2s ease;
    }

    .remember-me:hover {
        color: var(--text-primary);
    }

    .remember-me input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #3b82f6;
        cursor: pointer;
        border-radius: 4px;
        border: 2px solid rgba(59, 130, 246, 0.2);
        transition: border-color 0.2s ease;
    }

    .remember-me input[type="checkbox"]:checked {
        border-color: #3b82f6;
    }

    .password-toggle {
        background: none;
        border: none;
        cursor: pointer;
        padding: 0.25rem 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-secondary);
        transition: color 0.2s ease, background 0.2s ease;
        border-radius: 8px;
        font-size: 0.9rem;
        font-weight: 500;
        gap: 0.5rem;
        background: rgba(59, 130, 246, 0.04);
        border: 1px solid rgba(59, 130, 246, 0.04);
    }

    .password-toggle:hover {
        color: #3b82f6;
        background: rgba(59, 130, 246, 0.08);
        border-color: rgba(59, 130, 246, 0.1);
    }

    .password-toggle svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
    }

    /* Кнопка входа - синий градиент */
    .submit-btn {
        width: 100%;
        padding: 1rem;
        background: linear-gradient(135deg, #3b82f6, #1d4ed8);
        color: white;
        border: none;
        border-radius: 16px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        margin-top: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        position: relative;
        z-index: 2;
        box-shadow: 0 6px 24px rgba(59, 130, 246, 0.2);
        letter-spacing: 0.3px;
    }

    .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 32px rgba(59, 130, 246, 0.25);
    }

    .submit-btn:active {
        transform: translateY(0);
        box-shadow: 0 4px 16px rgba(59, 130, 246, 0.15);
    }

    .submit-btn svg {
        stroke-width: 2.5;
        transition: transform 0.2s ease;
    }

    .submit-btn:hover svg {
        transform: translateX(3px);
    }

    /* Ссылки */
    .auth-links {
        display: flex;
        justify-content: center;
        margin-top: 1.25rem;
        font-size: 0.9rem;
        position: relative;
        z-index: 2;
    }

    .auth-link {
        color: var(--text-secondary);
        text-decoration: none;
        transition: color 0.2s ease, background 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-weight: 500;
        padding: 0.5rem 1rem;
        border-radius: 10px;
        background: rgba(59, 130, 246, 0.02);
        border: 1px solid transparent;
    }

    .auth-link:hover {
        color: #3b82f6;
        background: rgba(59, 130, 246, 0.06);
        border-color: rgba(59, 130, 246, 0.08);
    }

    .auth-link svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
    }

    /* Разделитель */
    .auth-divider {
        position: relative;
        text-align: center;
        margin: 1.75rem 0 1.25rem;
        z-index: 2;
    }

    .auth-divider::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(59, 130, 246, 0.1), transparent);
    }

    .auth-divider span {
        position: relative;
        background: var(--bg-card);
        padding: 0 1.25rem;
        font-size: 0.85rem;
        color: var(--text-secondary);
        font-weight: 400;
        background: rgba(255, 255, 255, 0.8);
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    [data-theme='dark'] .auth-divider span {
        background: rgba(30, 41, 59, 0.8);
    }

    /* Кнопка регистрации */
    .register-btn {
        width: 100%;
        padding: 1rem;
        background: transparent;
        border: 2px solid rgba(59, 130, 246, 0.12);
        border-radius: 16px;
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-primary);
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
        text-decoration: none;
        position: relative;
        z-index: 2;
        background: rgba(59, 130, 246, 0.02);
    }

    [data-theme='dark'] .register-btn {
        border-color: rgba(59, 130, 246, 0.08);
        background: rgba(59, 130, 246, 0.02);
    }

    .register-btn:hover {
        border-color: #3b82f6;
        background: rgba(59, 130, 246, 0.05);
        color: #3b82f6;
        transform: translateY(-1px);
        box-shadow: 0 4px 16px rgba(59, 130, 246, 0.04);
    }

    .register-btn svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        transition: transform 0.2s ease;
    }

    .register-btn:hover svg {
        transform: scale(1.05);
    }

    /* Алерты */
    .alert {
        padding: 0.875rem 1.25rem;
        border-radius: 14px;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 0.75rem;
        position: relative;
        z-index: 2;
        border-left: 4px solid;
    }

    .alert-error {
        background: rgba(239, 68, 68, 0.06);
        border-color: #ef4444;
        color: #ef4444;
    }

    .alert-success {
        background: rgba(16, 185, 129, 0.06);
        border-color: #10b981;
        color: #10b981;
    }

    .alert svg {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        stroke: currentColor;
    }

    /* Адаптивность */
    @media (max-width: 640px) {
        .auth-container {
            padding: 1rem;
        }
        
        .auth-card {
            padding: 2.5rem 1.75rem;
            border-radius: 24px;
            max-width: 100%;
        }
        
        .auth-title {
            font-size: 1.5rem;
        }
        
        .cat-image-wrapper img {
            width: 90px;
            height: 90px;
        }

        .cat-image-wrapper::before {
            width: 110px;
            height: 110px;
        }
        
        .form-group input {
            padding: 0.875rem 1rem;
            font-size: 0.9rem;
        }

        .form-options {
            flex-direction: column;
            gap: 0.75rem;
            align-items: flex-start;
        }

        .auth-links {
            justify-content: center;
        }

        .auth-container .bg-circle-1 {
            width: 250px;
            height: 250px;
            top: -80px;
            right: -60px;
        }

        .auth-container .bg-circle-2 {
            width: 180px;
            height: 180px;
            bottom: -40px;
            left: -40px;
        }

        .auth-container .bg-circle-3 {
            width: 120px;
            height: 120px;
        }

        .auth-container .bg-circle-4 {
            width: 70px;
            height: 70px;
        }

        .auth-container .bg-circle-5 {
            width: 80px;
            height: 80px;
        }
    }

    /* Тёмная тема */
    [data-theme='dark'] .auth-card {
        background: linear-gradient(145deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.95) 100%);
    }

    [data-theme='dark'] .submit-btn {
        box-shadow: 0 6px 24px rgba(59, 130, 246, 0.12);
    }

    [data-theme='dark'] .submit-btn:hover {
        box-shadow: 0 10px 32px rgba(59, 130, 246, 0.2);
    }

    [data-theme='dark'] .form-group input:focus {
        background: rgba(30, 41, 59, 0.8);
    }

    [data-theme='dark'] .auth-container .bg-circle {
        opacity: 0.04;
    }

    [data-theme='dark'] .auth-divider span {
        background: rgba(30, 41, 59, 0.8);
    }
</style>

<div class="auth-container">
    <!-- Фоновые круглые фигуры -->
    <div class="bg-circles">
        <div class="bg-circle bg-circle-1"></div>
        <div class="bg-circle bg-circle-2"></div>
        <div class="bg-circle bg-circle-3"></div>
        <div class="bg-circle bg-circle-4"></div>
        <div class="bg-circle bg-circle-5"></div>
    </div>

    <div class="auth-card">
        <!-- Картинка кота из папки static -->
        <div class="cat-image-wrapper">
            <img 
                src="static/angry.png"}"
                alt="Кот"
                loading="lazy"
                width="120"
                height="120"
            >
        </div>
        
        <h1 class="auth-title">Добро пожаловать</h1>
        <p class="auth-subtitle">Войдите в систему мониторинга питания</p>
        
        {% if error %}
        <div class="alert alert-error">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
            <span>{{ error }}</span>
        </div>
        {% endif %}
        
        {% if success %}
        <div class="alert alert-success">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
            <span>{{ success }}</span>
        </div>
        {% endif %}
        
        <form action="/login" method="post" class="auth-form">
            <div class="form-group">
                <input type="email" name="email" placeholder="Электронная почта" required autocomplete="email">
            </div>
            
            <div class="form-group">
                <input type="password" name="password" id="password" placeholder="Пароль" required autocomplete="current-password">
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" name="remember">
                    Запомнить меня
                </label>
                <button type="button" class="password-toggle" onclick="togglePassword()" aria-label="Показать/скрыть пароль">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    Показать
                </button>
            </div>
            
            <button type="submit" class="submit-btn">
                Войти
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M5 12h14M12 5l7 7-7 7"/>
                </svg>
            </button>
        </form>
        
        <div class="auth-links">
            <a href="/reset-password-request" class="auth-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 8v4l3 3M12 2a10 10 0 1 0 10 10"/>
                </svg>
                Забыли пароль?
            </a>
        </div>
        
        <div class="auth-divider">
            <span>Нет аккаунта?</span>
        </div>
        
        <a href="/register" class="register-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="8.5" cy="7" r="4"/>
                <line x1="20" y1="8" x2="20" y2="14"/>
                <line x1="23" y1="11" x2="17" y2="11"/>
            </svg>
            Зарегистрироваться
        </a>
    </div>
</div>

<script>
function togglePassword() {
    const passwordInput = document.getElementById('password');
    const toggleButton = document.querySelector('.password-toggle');
    
    if (!passwordInput || !toggleButton) return;
    
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    
    toggleButton.innerHTML = isPassword ? `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
        </svg>
        Скрыть
    ` : `
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
        </svg>
        Показать
    `;
}

document.addEventListener('DOMContentLoaded', function() {
    const passwordInput = document.getElementById('password');
    if (passwordInput) {
        passwordInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const form = this.closest('form');
                if (form) form.submit();
            }
        });
    }
});

// Отключаем анимации для слабых ПК
if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('.auth-card, .auth-container, .alert').forEach(el => {
        el.style.animation = 'none';
        el.style.transition = 'none';
    });
}
</script>
{% endblock %}
