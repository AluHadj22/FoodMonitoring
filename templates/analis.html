<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Анализ статистики — ЕЦМ</title>
    <style>
        /* ------------------------------
           Глобальные переменные (бизнес-стиль)
        -------------------------------- */
        :root {
            --navy-900: #0a1e3c;
            --navy-800: #13294b;
            --navy-700: #1e3a6b;
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-300: #cbd5e1;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
            
            --primary: #1a4c8c;
            --primary-dark: #0e3a6b;
            --primary-light: #2c6eb0;
            --primary-bg: rgba(26, 76, 140, 0.05);
            --accent: #d97706;
            --accent-dark: #b45309;
            --success: #059669;
            --danger: #dc2626;
            --warning: #d97706;
            
            --bg-main: #ffffff;
            --bg-card: #ffffff;
            --border-light: #e9eef3;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025);
            --shadow-focus: 0 0 0 3px rgba(26, 76, 140, 0.15);
            
            --radius-sm: 6px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            
            --transition: all 0.2s ease;
        }

        [data-theme='dark'] {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --border-light: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --primary-light: #60a5fa;
            --primary-bg: rgba(59, 130, 246, 0.08);
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.5;
            transition: background 0.25s ease, color 0.2s ease;
            font-weight: 400;
            font-size: 0.9375rem;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1440px;
            margin: 0 auto;
            padding: 2rem;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeSlide 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards;
        }

        /* Карточка авторизации */
        .auth-card {
            background: var(--bg-card);
            border-radius: var(--radius-xl);
            padding: 2rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-light);
            max-width: 480px;
            margin: 4rem auto;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
        }

        .auth-card:hover {
            box-shadow: var(--shadow-lg);
        }

        .auth-icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 1rem;
            background: var(--primary-bg);
            border-radius: var(--radius-lg);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-icon svg {
            width: 28px;
            height: 28px;
            stroke: var(--primary);
        }

        .auth-title {
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
            text-align: center;
            letter-spacing: -0.3px;
        }

        .auth-subtitle {
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 1.5rem;
            font-size: 0.85rem;
        }

        /* Формы */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 0.4rem;
        }

        .form-input,
        .form-select {
            width: 100%;
            padding: 0.6rem 0.85rem;
            background: var(--bg-main);
            border: 1.5px solid var(--border-light);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 0.85rem;
            transition: var(--transition);
            font-family: inherit;
        }

        .form-input:focus,
        .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: var(--shadow-focus);
        }

        /* Кнопки */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem 1.25rem;
            border-radius: var(--radius-md);
            font-weight: 500;
            font-size: 0.8rem;
            cursor: pointer;
            transition: var(--transition);
            border: none;
            font-family: inherit;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-sm);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-bg);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
        }

        /* Основной интерфейс */
        .analysis-interface {
            display: none;
        }

        .welcome-message {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            padding: 1.25rem 1.5rem;
            border-radius: var(--radius-lg);
            margin-bottom: 1.5rem;
            border-left: 3px solid var(--primary);
        }

        .welcome-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.25rem;
        }

        .welcome-text {
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        /* Сетка карточек */
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .analysis-card {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            border: 1px solid var(--border-light);
            transition: var(--transition);
        }

        .analysis-card:hover {
            box-shadow: var(--shadow-md);
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .card-title svg {
            width: 18px;
            height: 18px;
            stroke: var(--primary);
        }

        /* Область загрузки файлов */
        .file-upload-zone {
            border: 2px dashed var(--border-light);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            text-align: center;
            background: var(--bg-main);
            transition: var(--transition);
            cursor: pointer;
            margin-bottom: 0.75rem;
        }

        .file-upload-zone:hover {
            border-color: var(--primary);
            background: var(--primary-bg);
        }

        .file-upload-zone p {
            color: var(--text-primary);
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
        }

        .file-upload-zone small {
            color: var(--text-muted);
            font-size: 0.7rem;
        }

        .file-info {
            display: none;
            margin-top: 0.75rem;
            padding: 0.65rem 0.85rem;
            background: var(--primary-bg);
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }

        /* Результаты */
        .results-section {
            background: var(--bg-card);
            border-radius: var(--radius-lg);
            padding: 1.25rem;
            border: 1px solid var(--border-light);
            margin-top: 1.5rem;
            display: none;
        }

        .stat-summary {
            background: var(--primary-bg);
            padding: 1rem;
            border-radius: var(--radius-md);
            margin-bottom: 1rem;
            font-size: 0.85rem;
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }

        .stat-summary strong {
            color: var(--primary);
        }

        .results-table-wrapper {
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.85rem;
        }

        .results-table th,
        .results-table td {
            padding: 0.75rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-light);
        }

        .results-table th {
            background: var(--primary-bg);
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .results-table tr:hover {
            background: var(--primary-bg);
        }

        .results-table .current-user {
            background: var(--primary-bg);
            border-left: 3px solid var(--primary);
        }

        .score-high { color: var(--success); font-weight: 600; }
        .score-medium { color: var(--warning); font-weight: 600; }
        .score-low { color: var(--danger); }
        .score-critical { color: #dc2626; font-weight: 600; }

        .info-box {
            margin-top: 1rem;
            padding: 1rem;
            background: var(--primary-bg);
            border-radius: var(--radius-md);
            font-size: 0.75rem;
            color: var(--text-muted);
            border: 1px solid var(--border-light);
        }

        .info-box ul {
            margin-top: 0.5rem;
            padding-left: 1.25rem;
        }

        .info-box li {
            margin-bottom: 0.25rem;
        }

        /* Уведомления */
        .notification {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius-md);
            background: var(--primary);
            color: white;
            font-weight: 500;
            font-size: 0.8rem;
            box-shadow: var(--shadow-lg);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: var(--danger);
        }

        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }
            .analysis-grid {
                grid-template-columns: 1fr;
                gap: 1rem;
            }
            .auth-card {
                margin: 2rem 1rem;
                padding: 1.5rem;
            }
            .results-table {
                font-size: 0.75rem;
            }
            .results-table th,
            .results-table td {
                padding: 0.5rem 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .auth-card {
                margin: 1rem;
                padding: 1.25rem;
            }
            .auth-title {
                font-size: 1.1rem;
            }
            .results-table {
                font-size: 0.7rem;
            }
            .results-table th,
            .results-table td {
                padding: 0.4rem 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Форма авторизации -->
        <div id="authSection" class="auth-card fade-in">
            <div class="auth-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                    <path d="M21 12a9 9 0 0 1-9 9m9-9a9 9 0 0 0-9-9m9 9h-4m-7 9A9 9 0 0 1 3 12m9 9v-4M3 12a9 9 0 0 1 9-9m-9 9h4m7-9a9 9 0 0 1 9 9"/>
                    <path d="M12 7v5l3 3"/>
                </svg>
            </div>
            <h1 class="auth-title">Анализ статистики</h1>
            <p class="auth-subtitle">Введите данные для доступа к системе анализа</p>
            
            <form id="authForm">
                <div class="form-group">
                    <label class="form-label">Название учреждения</label>
                    <input type="text" class="form-input" id="institutionName" required 
                           placeholder="Введите полное название учреждения">
                </div>
                
                <div class="form-group">
                    <label class="form-label">ФИО ответственного</label>
                    <input type="text" class="form-input" id="responsibleName" required 
                           placeholder="Фамилия Имя Отчество">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Код доступа</label>
                    <input type="password" class="form-input" id="accessCode" required 
                           placeholder="Введите код доступа">
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    Получить доступ
                </button>
            </form>
        </div>

        <!-- Основной интерфейс анализа -->
        <div id="analysisSection" class="analysis-interface">
            <div class="welcome-message fade-in">
                <h2 class="welcome-title" id="welcomeTitle">Добро пожаловать!</h2>
                <p class="welcome-text" id="welcomeText">Вы успешно авторизовались в системе анализа статистики.</p>
            </div>

            <div class="analysis-grid">
                <div class="analysis-card fade-in" style="animation-delay: 0.1s">
                    <h3 class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                            <polyline points="14 2 14 8 20 8"/>
                        </svg>
                        Загрузка данных
                    </h3>
                    <div class="file-upload-zone" onclick="document.getElementById('fileInput').click()">
                        <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="handleFileSelect(this)" style="display: none;">
                        <p>📁 Выберите файл Excel для анализа</p>
                        <small>Поддерживаются форматы .xlsx и .xls</small>
                    </div>
                    <div id="fileInfo" class="file-info">
                        <strong>Выбранный файл:</strong> <span id="fileName"></span><br>
                        <strong>Размер:</strong> <span id="fileSize"></span>
                    </div>
                </div>

                <div class="analysis-card fade-in" style="animation-delay: 0.2s">
                    <h3 class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="16"/>
                            <line x1="8" y1="12" x2="16" y2="12"/>
                        </svg>
                        Анализ соответствия
                    </h3>
                    <div class="form-group">
                        <label class="form-label">Тип анализа</label>
                        <select class="form-select" id="analysisType">
                            <option value="menuCompliance">Соответствие типовому меню</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" onclick="analyzeData()" id="analyzeBtn" disabled style="width: 100%;">
                        <span id="analyzeText">Запустить анализ</span>
                        <span id="analyzeSpinner" class="loading-spinner" style="display: none;"></span>
                    </button>
                </div>
            </div>

            <div class="results-section" id="resultsSection">
                <h3 class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                    Результаты анализа
                </h3>
                <div id="resultsContent"></div>
                <button class="btn btn-secondary" onclick="saveResults()" id="saveBtn" style="display: none; margin-top: 1rem;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                        <polyline points="17 21 17 13 7 13 7 21"/>
                        <polyline points="7 3 7 8 15 8"/>
                    </svg>
                    Сохранить результаты
                </button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        // Конфигурация
        const ACCESS_CODE = "admin3377%";
        
        // DOM элементы
        const authSection = document.getElementById('authSection');
        const analysisSection = document.getElementById('analysisSection');
        const authForm = document.getElementById('authForm');
        const welcomeTitle = document.getElementById('welcomeTitle');
        const welcomeText = document.getElementById('welcomeText');
        const notification = document.getElementById('notification');
        const fileInput = document.getElementById('fileInput');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const resultsContent = document.getElementById('resultsContent');
        const resultsSection = document.getElementById('resultsSection');
        const saveBtn = document.getElementById('saveBtn');

        let excelData = null;

        // Авторизация
        authForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const institution = document.getElementById('institutionName').value;
            const responsible = document.getElementById('responsibleName').value;
            const code = document.getElementById('accessCode').value;
            
            if (code === ACCESS_CODE) {
                showNotification('Доступ предоставлен', 'success');
                
                welcomeTitle.textContent = `Добро пожаловать, ${responsible}!`;
                welcomeText.textContent = `Учреждение: ${institution}`;
                
                setTimeout(() => {
                    authSection.style.display = 'none';
                    analysisSection.style.display = 'block';
                    analysisSection.querySelectorAll('.fade-in').forEach(el => {
                        el.style.animation = 'fadeSlide 0.35s cubic-bezier(0.2, 0.9, 0.4, 1.1) forwards';
                    });
                }, 300);
            } else {
                showNotification('Неверный код доступа', 'error');
            }
        });

        // Обработка выбора файла
        function handleFileSelect(input) {
            if (input.files.length > 0) {
                const file = input.files[0];
                const fileInfo = document.getElementById('fileInfo');
                const fileName = document.getElementById('fileName');
                const fileSize = document.getElementById('fileSize');
                
                fileName.textContent = file.name;
                fileSize.textContent = (file.size / (1024 * 1024)).toFixed(2) + ' МБ';
                fileInfo.style.display = 'block';
                analyzeBtn.disabled = false;
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    excelData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
                    showNotification('Файл успешно загружен', 'success');
                };
                reader.readAsArrayBuffer(file);
            }
        }

        // Анализ данных
        function analyzeData() {
            if (!excelData) {
                showNotification('Сначала выберите файл Excel', 'error');
                return;
            }

            const analyzeText = document.getElementById('analyzeText');
            const analyzeSpinner = document.getElementById('analyzeSpinner');

            analyzeText.style.display = 'none';
            analyzeSpinner.style.display = 'inline-block';
            analyzeBtn.disabled = true;

            setTimeout(() => {
                try {
                    const results = analyzeMenuCompliance(excelData);
                    displayResults(results);
                    resultsSection.style.display = 'block';
                    saveBtn.style.display = 'inline-flex';
                    showNotification('Анализ успешно завершен', 'success');
                } catch (error) {
                    console.error(error);
                    showNotification('Ошибка при анализе: ' + error.message, 'error');
                } finally {
                    analyzeText.style.display = 'inline-block';
                    analyzeSpinner.style.display = 'none';
                    analyzeBtn.disabled = false;
                }
            }, 100);
        }

        // Парсинг данных Excel
        function analyzeMenuCompliance(rows) {
            const headers = rows[0];
            let districtColIndex = -1;
            let complianceColIndex = -1;
            
            for (let i = 0; i < headers.length; i++) {
                const header = String(headers[i]).toLowerCase().trim();
                if (header.includes('район')) districtColIndex = i;
                if (header.includes('процент соблюдения') || header.includes('процент соблюдени')) complianceColIndex = i;
            }
            
            if (districtColIndex === -1 || complianceColIndex === -1) {
                throw new Error('Не найдены необходимые столбцы: "Район" и "Процент Соблюдения"');
            }
            
            const districtsMap = new Map();
            
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length === 0) continue;
                
                const district = row[districtColIndex] ? String(row[districtColIndex]).trim() : '';
                if (!district) continue;
                
                let complianceValue = null;
                const complianceCell = row[complianceColIndex];
                
                if (complianceCell !== undefined && complianceCell !== '') {
                    const cellStr = String(complianceCell).trim();
                    const numMatch = cellStr.match(/[\d]+(?:\.\d+)?/);
                    if (numMatch) complianceValue = parseFloat(numMatch[0]);
                }
                
                if (complianceValue !== null && !isNaN(complianceValue) && complianceValue >= 0 && complianceValue <= 100) {
                    if (!districtsMap.has(district)) districtsMap.set(district, []);
                    districtsMap.get(district).push(complianceValue);
                }
            }
            
            const results = [];
            let totalRecords = 0, totalPerfect = 0, totalGood = 0;
            
            for (const [district, values] of districtsMap) {
                const avgCompliance = values.reduce((sum, val) => sum + val, 0) / values.length;
                results.push({
                    district: district,
                    score: Math.round(avgCompliance * 100) / 100,
                    recordCount: values.length,
                    perfectCount: values.filter(v => v === 100).length,
                    goodCount: values.filter(v => v >= 75).length
                });
                totalRecords += values.length;
                totalPerfect += values.filter(v => v === 100).length;
                totalGood += values.filter(v => v >= 75).length;
            }
            
            results.sort((a, b) => b.score - a.score);
            
            return {
                districts: results,
                totalRecords: totalRecords,
                totalPerfect: totalPerfect,
                totalGood: totalGood,
                totalPerfectPercent: totalRecords > 0 ? (totalPerfect / totalRecords) * 100 : 0,
                totalGoodPercent: totalRecords > 0 ? (totalGood / totalRecords) * 100 : 0
            };
        }

        // Отображение результатов
        function displayResults(results) {
            let html = `
                <div class="stat-summary">
                    <strong>Общая статистика по региону</strong><br>
                    Всего записей: ${results.totalRecords}<br>
                    Полное соответствие (100%): ${results.totalPerfect} записей (${results.totalPerfectPercent.toFixed(2)}%)<br>
                    Хорошее соответствие (75-100%): ${results.totalGood} записей (${results.totalGoodPercent.toFixed(2)}%)
                </div>
                <div class="results-table-wrapper">
                <table class="results-table">
                    <thead>
                        <tr><th>№</th><th>Район</th><th>Средний процент</th><th>Записей</th><th>100%</th><th>≥75%</th></tr>
                    </thead>
                    <tbody>
            `;
            
            for (let i = 0; i < results.districts.length; i++) {
                const item = results.districts[i];
                const perfectPercent = item.recordCount > 0 ? (item.perfectCount / item.recordCount * 100).toFixed(2) : 0;
                const goodPercent = item.recordCount > 0 ? (item.goodCount / item.recordCount * 100).toFixed(2) : 0;
                
                let scoreClass = '';
                if (item.score >= 90) scoreClass = 'score-high';
                else if (item.score >= 75) scoreClass = 'score-medium';
                else if (item.score >= 50) scoreClass = 'score-low';
                else scoreClass = 'score-critical';
                
                html += `<tr>
                    <td>${i + 1}</td>
                    <td><strong>${item.district}</strong></td>
                    <td class="${scoreClass}">${item.score.toFixed(2)}%</td>
                    <td>${item.recordCount}</td>
                    <td>${item.perfectCount} (${perfectPercent}%)</td>
                    <td>${item.goodCount} (${goodPercent}%)</td>
                </tr>`;
            }
            
            html += `
                    </tbody>
                </table>
                </div>
                <div class="info-box">
                    <strong>Пояснения</strong>
                    <ul>
                        <li><strong>Средний процент соблюдения</strong> — среднее арифметическое значений по всем учреждениям района</li>
                        <li><strong>Полное соответствие (100%)</strong> — количество записей с процентом соблюдения 100%</li>
                        <li><strong>Хорошее соответствие (≥75%)</strong> — количество записей с процентом соблюдения 75% и выше</li>
                    </ul>
                </div>
            `;
            
            resultsContent.innerHTML = html;
        }

        // Сохранение результатов
        function saveResults() {
            const resultsHtml = resultsContent.innerHTML;
            const html = `
                <!DOCTYPE html>
                <html>
                <head><meta charset="UTF-8"><title>Анализ соответствия ТМ</title>
                <style>
                    body { font-family: 'Inter', Arial, sans-serif; margin: 40px; background: #f9fafb; }
                    .container { max-width: 1200px; margin: 0 auto; }
                    h1 { color: #1a4c8c; font-weight: 600; }
                    table { border-collapse: collapse; width: 100%; margin: 20px 0; font-size: 0.85rem; }
                    th, td { border: 1px solid #e2e8f0; padding: 10px 14px; text-align: left; }
                    th { background: #1a4c8c; color: white; font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.5px; }
                    tr:nth-child(even) { background: #f8fafc; }
                    .stat-summary { background: #f0f7ff; padding: 20px; border-radius: 8px; margin-bottom: 20px; border-left: 4px solid #1a4c8c; }
                    .score-high { color: #059669; font-weight: 600; }
                    .score-medium { color: #d97706; font-weight: 600; }
                    .score-low { color: #dc2626; }
                    .score-critical { color: #991b1b; font-weight: 600; }
                    .info-box { margin-top: 20px; padding: 16px; background: #f1f5f9; border-radius: 8px; font-size: 0.8rem; }
                    .info-box ul { margin-top: 8px; padding-left: 20px; }
                    .info-box li { margin-bottom: 4px; }
                </style>
                </head>
                <body>
                    <div class="container">
                        <h1>Результаты анализа соответствия типовому меню</h1>
                        <p>Дата: ${new Date().toLocaleString('ru-RU')}</p>
                        ${resultsHtml}
                    </div>
                </body>
                </html>
            `;
            
            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `анализ_ТМ_${new Date().toISOString().slice(0, 19).replace(/:/g, '-')}.html`;
            link.click();
            URL.revokeObjectURL(link.href);
            
            showNotification('Результаты сохранены', 'success');
        }

        // Уведомления
        function showNotification(message, type = 'success') {
            notification.textContent = message;
            notification.className = `notification ${type === 'error' ? 'error' : ''}`;
            notification.classList.add('show');
            setTimeout(() => notification.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
