<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализ статистики - Панель администратора</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            color: #e2e8f0;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Анимации */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .fade-in-up {
            animation: fadeInUp 0.8s ease-out;
        }

        .slide-in-right {
            animation: slideInRight 0.8s ease-out;
        }

        /* Карточка авторизации */
        .auth-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 1.5rem;
            padding: 3rem;
            box-shadow: 0 20px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
            margin: 5rem auto;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
        }

        .auth-title {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .auth-subtitle {
            color: #94a3b8;
            text-align: center;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }

        /* Форма */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
        }

        .form-input {
            width: 100%;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.7);
            border: 2px solid rgba(100, 116, 139, 0.3);
            border-radius: 0.75rem;
            color: #e2e8f0;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
            background: rgba(15, 23, 42, 0.9);
        }

        .auth-button {
            width: 100%;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
            border: none;
            padding: 1rem 2rem;
            border-radius: 0.75rem;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .auth-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
        }

        .auth-button:active {
            transform: translateY(0);
        }

        /* Основной интерфейс анализа */
        .analysis-interface {
            display: none;
        }

        .welcome-message {
            background: linear-gradient(135deg, #1e293b, #334155);
            padding: 2rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            border-left: 4px solid #3b82f6;
        }

        .welcome-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Карточки функционала */
        .analysis-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .analysis-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .analysis-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            border-color: rgba(59, 130, 246, 0.3);
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #e2e8f0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card-title svg {
            width: 24px;
            height: 24px;
            color: #3b82f6;
        }

        /* Кнопки */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: rgba(100, 116, 139, 0.3);
            color: #e2e8f0;
        }

        .btn-secondary:hover {
            background: rgba(100, 116, 139, 0.5);
        }

        /* Область загрузки файлов */
        .file-upload-zone {
            border: 2px dashed rgba(100, 116, 139, 0.5);
            border-radius: 0.75rem;
            padding: 2rem;
            text-align: center;
            background: rgba(15, 23, 42, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 1rem;
        }

        .file-upload-zone:hover {
            border-color: #3b82f6;
            background: rgba(15, 23, 42, 0.5);
        }

        .file-upload-zone input {
            display: none;
        }

        /* Результаты анализа */
        .results-section {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .results-table th,
        .results-table td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .results-table th {
            background: rgba(15, 23, 42, 0.5);
            font-weight: 600;
            color: #3b82f6;
        }

        .results-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        /* Уведомления */
        .notification {
            position: fixed;
            top: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 0.75rem;
            background: #059669;
            color: white;
            font-weight: 600;
            box-shadow: 0 10px 15px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc2626;
        }

        .notification.warning {
            background: #d97706;
        }

        /* Загрузка */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .auth-card {
                padding: 2rem;
                margin: 2rem auto;
            }

            .analysis-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Форма авторизации -->
        <div id="authSection" class="auth-card fade-in-up">
            <h1 class="auth-title">Анализ статистики</h1>
            <p class="auth-subtitle">Введите данные для доступа к системе анализа</p>
            
            <form id="authForm">
                <div class="form-group">
                    <label class="form-label">Название учреждения</label>
                    <input type="text" class="form-input" id="institutionName" required 
                           placeholder="Введите полное название учреждения">
                </div>
                
                <div class="form-group">
                    <label class="form-label">ФИО ответственного</label>
                    <input type="text" class="form-input" id="responsibleName" required 
                           placeholder="Фамилия Имя Отчество">
                </div>
                
                <div class="form-group">
                    <label class="form-label">Код доступа для Министерства и РОО</label>
                    <input type="password" class="form-input" id="accessCode" required 
                           placeholder="Введите код доступа">
                </div>
                
                <button type="submit" class="auth-button">
                    Получить доступ к анализу
                </button>
            </form>
        </div>

        <!-- Основной интерфейс анализа (скрыт до авторизации) -->
        <div id="analysisSection" class="analysis-interface">
            <!-- Приветственное сообщение -->
            <div class="welcome-message slide-in-right">
                <h2 class="welcome-title" id="welcomeTitle">Добро пожаловать!</h2>
                <p id="welcomeText">Вы успешно авторизовались в системе анализа статистики.</p>
            </div>

            <!-- Функционал анализа -->
            <div class="analysis-grid">
                <!-- Карточка загрузки файла -->
                <div class="analysis-card slide-in-right" style="animation-delay: 0.1s">
                    <h3 class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        Загрузка данных
                    </h3>
                    <div class="file-upload-zone" onclick="document.getElementById('fileInput').click()">
                        <input type="file" id="fileInput" accept=".xlsx,.xls" onchange="handleFileSelect(this)">
                        <p>Выберите файл Excel для анализа</p>
                        <small>Поддерживаются форматы .xlsx и .xls</small>
                    </div>
                    <div id="fileInfo" style="display: none; margin-top: 1rem; padding: 1rem; background: rgba(15,23,42,0.5); border-radius: 0.5rem;">
                        <strong>Выбранный файл:</strong> <span id="fileName"></span><br>
                        <strong>Размер:</strong> <span id="fileSize"></span>
                    </div>
                </div>

                <!-- Карточка настроек анализа -->
                <div class="analysis-card slide-in-right" style="animation-delay: 0.2s">
                    <h3 class="card-title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="12" y1="8" x2="12" y2="16"></line>
                            <line x1="8" y1="12" x2="16" y2="12"></line>
                        </svg>
                        Настройки анализа
                    </h3>
                    <div class="form-group">
                        <label class="form-label">Тип анализа</label>
                        <select class="form-input" id="analysisType">
                            <option value="score5">Балл нормированный к 5</option>
                            <option value="menuCompliance">Соответствие типовому меню</option>
                        </select>
                    </div>
                    <button class="btn btn-primary" onclick="analyzeData()" id="analyzeBtn" disabled>
                        <span id="analyzeText">Запустить анализ</span>
                        <span id="analyzeSpinner" class="loading" style="display: none;"></span>
                    </button>
                </div>
            </div>

            <!-- Результаты анализа -->
            <div class="results-section slide-in-right" style="animation-delay: 0.3s" id="resultsSection" style="display: none;">
                <h3 class="card-title">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    Результаты анализа
                </h3>
                <div id="resultsContent">
                    <!-- Результаты будут отображаться здесь -->
                </div>
                <button class="btn btn-secondary" onclick="saveResults()" id="saveBtn" style="display: none;">
                    Сохранить результаты
                </button>
            </div>
        </div>
    </div>

    <!-- Уведомление -->
    <div class="notification" id="notification"></div>

     <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
    // Конфигурация
    const ACCESS_CODE = "admin3377%";
    const DISTRICTS = [
        "Аргун", "Ачхой-Мартановский", "Веденский", "Грозненский", "Грозный",
        "Гудермесский", "Гудермес", "Итум-Калинский", "Курчалоевский", "Надтеречный",
        "Наурский", "Ножай-Юртовский", "Серноводский", "Урус-Мартановский",
        "Шалинский", "Шаройский", "Шатойский", "Шелковской"
    ];

    // Элементы DOM
    const authSection = document.getElementById('authSection');
    const analysisSection = document.getElementById('analysisSection');
    const authForm = document.getElementById('authForm');
    const welcomeTitle = document.getElementById('welcomeTitle');
    const welcomeText = document.getElementById('welcomeText');
    const notification = document.getElementById('notification');
    const fileInput = document.getElementById('fileInput');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const resultsContent = document.getElementById('resultsContent');

    // Обработка формы авторизации
    authForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const institution = document.getElementById('institutionName').value;
        const responsible = document.getElementById('responsibleName').value;
        const code = document.getElementById('accessCode').value;
        
        if (code === ACCESS_CODE) {
            showNotification('Доступ предоставлен!', 'success');
            
            welcomeTitle.textContent = `Добро пожаловать, ${responsible}!`;
            welcomeText.textContent = `Учреждение: ${institution}`;
            
            setTimeout(() => {
                authSection.style.display = 'none';
                analysisSection.style.display = 'block';
            }, 1000);
        } else {
            showNotification('Неверный код доступа!', 'error');
        }
    });

    // Обработка выбора файла
    function handleFileSelect(input) {
        if (input.files.length > 0) {
            const file = input.files[0];
            const fileInfo = document.getElementById('fileInfo');
            const fileName = document.getElementById('fileName');
            const fileSize = document.getElementById('fileSize');
            const analyzeBtn = document.getElementById('analyzeBtn');
            
            fileName.textContent = file.name;
            fileSize.textContent = (file.size / (1024 * 1024)).toFixed(2) + ' МБ';
            fileInfo.style.display = 'block';
            analyzeBtn.disabled = false;
            
            showNotification('Файл успешно выбран', 'success');
        }
    }

    // Основная функция анализа данных
    async function analyzeData() {
        const analyzeText = document.getElementById('analyzeText');
        const analyzeSpinner = document.getElementById('analyzeSpinner');
        const analysisType = document.getElementById('analysisType').value;
        const resultsSection = document.getElementById('resultsSection');
        const saveBtn = document.getElementById('saveBtn');

        if (!fileInput.files.length) {
            showNotification('Выберите файл Excel!', 'error');
            return;
        }

        const file = fileInput.files[0];

        // Показываем загрузку
        analyzeText.style.display = 'none';
        analyzeSpinner.style.display = 'inline-block';
        analyzeBtn.disabled = true;

        try {
            const data = await file.arrayBuffer();
            const workbook = XLSX.read(data, { type: 'array' });
            const worksheet = workbook.Sheets[workbook.SheetNames[0]];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });

            const rows = jsonData.map(row => row.map(cell => String(cell).trim()));
            let results;

            if (analysisType === 'score5') {
                results = analyzeScore5(rows);
            } else {
                results = analyzeMenuCompliance(rows);
            }

            displayResults(results, analysisType);
            resultsSection.style.display = 'block';
            saveBtn.style.display = 'inline-block';
            showNotification('Анализ завершен!', 'success');

        } catch (error) {
            console.error(error);
            showNotification('Ошибка при анализе файла: ' + error.message, 'error');
        }

        analyzeText.style.display = 'inline-block';
        analyzeSpinner.style.display = 'none';
        analyzeBtn.disabled = false;
    }

    // Анализ "Балл нормированный к 5" (оригинальная версия)
    function analyzeScore5(rows) {
        const districtData = {};
        let currentDistrict = null;

        for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            const firstCell = row[0];

            // Ищем название района
            for (const district of DISTRICTS) {
                if (firstCell === district) {
                    currentDistrict = district;
                    if (!districtData[district]) {
                        districtData[district] = {
                            score5Data: [],
                            recordCount: 0
                        };
                    }
                    break;
                }
            }

            // Если в районе и есть дата в первой ячейке
            if (currentDistrict && i > 0) {
                const dateRegex = /^\d{1,2}\.\d{1,2}\.\d{4}$/;
                if (dateRegex.test(firstCell)) {
                    const scoreStr = row[1];
                    let score = null;

                    if (scoreStr) {
                        const numMatch = scoreStr.match(/[\d,]+/);
                        if (numMatch) {
                            score = parseFloat(numMatch[0].replace(',', '.'));
                        }
                    }

                    districtData[currentDistrict].score5Data.push({
                        date: firstCell,
                        score: score,
                        rawValue: scoreStr
                    });
                    districtData[currentDistrict].recordCount++;
                }
            }
        }

        const results = [];
        for (const district in districtData) {
            const data = districtData[district];
            const validScores = data.score5Data
                .filter(item => item.score !== null)
                .map(item => item.score);

            let avgScore = null;
            if (validScores.length > 0) {
                avgScore = (validScores.reduce((sum, val) => sum + val, 0) / validScores.length).toFixed(2);
            }

            results.push({
                district: district,
                recordCount: data.recordCount,
                validRecords: validScores.length,
                averageScore: avgScore,
                minScore: validScores.length ? Math.min(...validScores).toFixed(2) : null,
                maxScore: validScores.length ? Math.max(...validScores).toFixed(2) : null
            });
        }

        return {
            type: 'score5',
            data: results,
            totalRecords: rows.length
        };
    }

    // Анализ "Соответствие типовому меню" (ваша новая версия)
    function analyzeMenuCompliance(rows) {
        const districtData = {};
        const allComplianceData = [];

        for (let i = 0; i < rows.length; i++) {
            const row = rows[i];

            if (!row[0] || row[0].trim() === '') continue;

            const cellValue = String(row[0]).trim();
            const isInstitutionRow = /(МБОУ|СОШ|ГБОУ|Школа)/i.test(cellValue);

            if (isInstitutionRow) {
                let districtFound = null;
                if (row[1]) {
                    const districtCell = String(row[1]).trim();
                    for (const district of DISTRICTS) {
                        if (districtCell.includes(district)) {
                            districtFound = district;
                            break;
                        }
                    }
                }

                if (districtFound) {
                    if (!districtData[districtFound]) {
                        districtData[districtFound] = {
                            complianceData: [],
                            recordCount: 0
                        };
                    }

                    for (let j = row.length - 2; j < row.length; j++) {
                        if (j >= 0 && row[j]) {
                            const cellValue = String(row[j]).trim();
                            const numMatch = cellValue.match(/[\d]+(?:\.\d+)?/);
                            if (numMatch) {
                                const complianceVal = parseFloat(numMatch[0]);
                                if (complianceVal >= 0 && complianceVal <= 100) {
                                    districtData[districtFound].complianceData.push(complianceVal);
                                    districtData[districtFound].recordCount++;
                                    allComplianceData.push(complianceVal);
                                    break;
                                }
                            }
                        }
                    }
                }
            }
        }

        const regionStats = calculateRegionStats(allComplianceData);
        const results = [];

        for (const district of DISTRICTS) {
            if (districtData[district]) {
                const data = districtData[district];
                if (data.recordCount > 0) {
                    const avgCompliance = data.complianceData.reduce((sum, val) => sum + val, 0) / data.complianceData.length;
                    results.push({
                        district: district,
                        score: Math.round(avgCompliance * 100) / 100,
                        recordCount: data.recordCount,
                        analysisType: 'menuCompliance'
                    });
                } else {
                    results.push({
                        district: district,
                        score: 0.0,
                        recordCount: 0,
                        analysisType: 'menuCompliance'
                    });
                }
            } else {
                results.push({
                    district: district,
                    score: 0.0,
                    recordCount: 0,
                    analysisType: 'menuCompliance'
                });
            }
        }

        results.push({
            district: 'ОБЩИЙ ПОКАЗАТЕЛЬ ПО РЕГИОНУ (100%)',
            score: Math.round(regionStats.perfectPercentage * 100) / 100,
            recordCount: allComplianceData.length,
            analysisType: 'menuCompliance',
            isRegionTotal: true,
            category: '100%'
        });

        results.push({
            district: 'ОБЩИЙ ПОКАЗАТЕЛЬ ПО РЕГИОНУ (75-100%)',
            score: Math.round(regionStats.goodPercentage * 100) / 100,
            recordCount: allComplianceData.length,
            analysisType: 'menuCompliance',
            isRegionTotal: true,
            category: '75-100%'
        });

        const regularResults = results.filter(r => !r.isRegionTotal);
        const regionTotals = results.filter(r => r.isRegionTotal);

        regularResults.sort((a, b) => b.score - a.score);

        return [...regularResults, ...regionTotals];
    }

    // Расчёт статистики по региону
    function calculateRegionStats(complianceData) {
        if (complianceData.length === 0) {
            return { perfectPercentage: 0, goodPercentage: 0 };
        }

        const perfectCount = complianceData.filter(val => val === 100).length;
        const perfectPercentage = (perfectCount / complianceData.length) * 100;

        const goodCount = complianceData.filter(val => val >= 75 && val <= 100).length;
        const goodPercentage = (goodCount / complianceData.length) * 100;

        return {
            perfectPercentage: perfectPercentage,
            goodPercentage: goodPercentage
        };
    }

    // Отображение результатов
    function displayResults(results, type) {
        let html = '';

        if (type === 'score5') {
            html += `
                <h4>Анализ "Балл нормированный к 5"</h4>
                <p>Всего обработано записей: ${results.totalRecords}</p>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Район</th>
                            <th>Записей</th>
                            <th>Действительных оценок</th>
                            <th>Средняя оценка</th>
                            <th>Мин. оценка</th>
                            <th>Макс. оценка</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (const item of results.data) {
                html += `
                    <tr>
                        <td>${item.district}</td>
                        <td>${item.recordCount}</td>
                        <td>${item.validRecords}</td>
                        <td>${item.averageScore || '—'}</td>
                        <td>${item.minScore || '—'}</td>
                        <td>${item.maxScore || '—'}</td>
                    </tr>
                `;
            }

            html += '</tbody></table>';

        } else if (type === 'menuCompliance') {
            html += `
                <h4>Анализ "Соответствие типовому меню"</h4>
                <p>Всего обработано пунктов меню: ${results.reduce((sum, r) => sum + (r.recordCount || 0), 0)}</p>
                <table class="results-table">
                    <thead>
                        <tr>
                            <th>Район</th>
                            <th>Соответствие (%)</th>
                            <th>Количество записей</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            for (const item of results) {
                const rowClass = item.isRegionTotal ? 'region-total' : '';
                const category = item.category ? ` (${item.category})` : '';

                html += `
                    <tr class="${rowClass}">
                        <td>${item.district}${category}</td>
                        <td>${item.score.toFixed(2)}%</td>
                        <td>${item.recordCount}</td>
                    </tr>
                `;
            }

            html += '</tbody></table>';

            html += `
                <div class="results-info">
                    <p><strong>Пояснения:</strong></p>
                    <ul>
                        <li><strong>ОБЩИЙ ПОКАЗАТЕЛЬ ПО РЕГИОНУ (100%)</strong> — процент организаций с полным (100%) соответствием типовому меню.</li>
                        <li><strong>ОБЩИЙ ПОКАЗАТЕЛЬ ПО РЕГИОНУ (75-100%)</strong> — процент организаций с соответствием типовому меню от 75% до 100%.</li>
                    </ul>
                </div>
            `;
        }

        resultsContent.innerHTML = html;
    }

    // Сохранение результатов
    function saveResults() {
        let html = `
            <!DOCTYPE html>
            <html lang="ru">
            <head>
                <meta charset="UTF-8">
                <title>Результаты анализа</title>
                <style>
                    body { font-family: Arial, sans-serif; margin: 20px; }
                    table { border-collapse: collapse; width: 100%; margin: 20px 0; }
                    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
                    th { background-color: #f2f2f2; }
                    .region-total { background-color: #e6f7ff; font-weight: bold; }
                    .results-info { margin-top: 20px; padding: 15px; background-color: #f9f9f9; border-radius: 5px; }
                </style>
            </head>
            <body>
                <h1>Результаты анализа</h1>
                ${resultsContent.innerHTML}
            </body>
            </html>
        `;

        const blob = new Blob([html], { type: 'text/html' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = 'результаты_анализа.html';
        link.click();
        URL.revokeObjectURL(link.href);
    }

    // Уведомление
    function showNotification(message, type = 'success') {
        notification.textContent = message;
        notification.className = 'notification';
        
        if (type === 'error') {
            notification.classList.add('error');
        } else if (type === 'warning') {
            notification.classList.add('warning');
        } else {
            notification.classList.add('success');
        }

        notification.classList.add('show');

        setTimeout(() => {
            notification.classList.remove('show');
        }, 3000);
    }
</script>
